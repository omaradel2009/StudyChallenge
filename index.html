<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي المذاكرة الأسبوعي الجماعي</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-start p-4 sm:p-6">

    <div class="w-full max-w-3xl bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700">
        
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500 mb-2">
                📚 تحدي المذاكرة الجماعي
            </h1>
            <p class="text-slate-400 text-sm sm:text-base">نافس أصدقائك، سجل ساعاتك، وحقق الهدف الأسبوعي أولاً!</p>
        </header>

        <!-- Room Setup / Joining Section -->
        <div id="room-section" class="bg-slate-900/60 p-5 rounded-xl border border-slate-700 mb-6 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
                <span class="text-xs text-cyan-400 font-bold block mb-1">رمز الغرفة النشطة:</span>
                <span id="current-room-display" class="text-xl font-black tracking-widest text-white">---</span>
            </div>
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <input type="text" id="room-input" placeholder="أدخل رمز الغرفة..." class="bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-400 flex-1 sm:w-40">
                <button onclick="joinRoom()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-4 py-2 rounded-lg text-sm transition shadow-lg">انضمام</button>
                <button onclick="createRoom()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-2 rounded-lg text-sm transition shadow-lg">غرفة جديدة</button>
            </div>
        </div>

        <!-- Main Challenge Area (Hidden until room is joined) -->
        <div id="challenge-container" class="hidden">
            
            <!-- Goal & Join Form -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <!-- Goal Card -->
                <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700 flex flex-col justify-between">
                    <div>
                        <h2 class="text-lg font-bold text-cyan-400 mb-1">🎯 الهدف الأسبوعي العام</h2>
                        <p class="text-slate-400 text-xs mb-3">حدد عدد ساعات المذاكرة المستهدفة لهذا الأسبوع للجميع.</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="number" id="weekly-goal-input" min="1" value="20" class="bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-white w-24 text-center font-bold">
                        <span class="text-sm text-slate-300">ساعة</span>
                        <button onclick="updateGoal()" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded-lg text-sm transition">حفظ الهدف</button>
                    </div>
                </div>

                <!-- Join/Add Competitor Form -->
                <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700 flex flex-col justify-between">
                    <div>
                        <h2 class="text-lg font-bold text-indigo-400 mb-1">👤 انضم كمنافس</h2>
                        <p class="text-slate-400 text-xs mb-3">سجل اسمك لتبدأ في تسجيل ساعاتك التنافسية.</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="text" id="competitor-name" placeholder="اسمك الكريم..." class="bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-white flex-1 text-sm">
                        <button onclick="addCompetitor()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-2 rounded-lg text-sm transition shadow-lg">انضم للتحدي</button>
                    </div>
                </div>
            </div>

            <!-- Log Hours Section -->
            <div id="log-section" class="hidden bg-slate-900/80 p-5 rounded-xl border border-indigo-500/30 mb-8">
                <h3 class="text-md font-bold text-emerald-400 mb-3">⏱️ تسجيل ساعات المذاكرة المنجزة</h3>
                <div class="flex flex-col sm:flex-row items-center gap-3">
                    <select id="active-competitor-select" class="bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm w-full sm:w-1/3">
                        <option value="">اختر اسمك...</option>
                    </select>
                    <input type="number" id="hours-to-add" min="0.5" step="0.5" placeholder="عدد الساعات (مثال: 2)" class="bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm w-full sm:w-1/3">
                    <button onclick="logHours()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-lg text-sm transition w-full sm:w-auto">تسجيل الساعات</button>
                </div>
            </div>

            <!-- Leaderboard Section -->
            <div>
                <h3 class="text-xl font-bold mb-4 text-white flex items-center gap-2">
                    🏆 لوحة الصدارة الحية
                </h3>
                <div id="leaderboard-list" class="space-y-4">
                    <!-- Dynamic Leaderboard Items will be inserted here -->
                </div>
            </div>

        </div>

    </div>

    <!-- Firebase SDKs (Compat / Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getDatabase, ref, set, get, update, onValue, child } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBPZi3wE4HLIC8hKO3THkyuk7kyfNmrB-E",
          authDomain: "studychallenge-7b8f4.firebaseapp.com",
          projectId: "studychallenge-7b8f4",
          storageBucket: "studychallenge-7b8f4.firebasestorage.app",
          messagingSenderId: "379768336358",
          appId: "1:379768336358:web:2386814b4f70bf591fb027",
          measurementId: "G-52L48YN0MH",
          databaseURL: "https://studychallenge-7b8f4-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentRoom = localStorage.getItem('study_room_code') || '';
        let unsubscribeRTDB = null;

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            if (roomParam) {
                currentRoom = roomParam;
                localStorage.setItem('study_room_code', currentRoom);
            }
            if (currentRoom) {
                document.getElementById('room-input').value = currentRoom;
                connectToRoom(currentRoom);
            }
        };

        window.createRoom = function() {
            const code = Math.random().toString(36).substring(2, 8).toUpperCase();
            currentRoom = code;
            localStorage.setItem('study_room_code', currentRoom);
            
            // Initialize room in RTDB
            set(ref(db, 'rooms/' + currentRoom), {
                goal: 20,
                competitors: {}
            }).then(() => {
                window.history.pushState({}, '', `?room=${currentRoom}`);
                connectToRoom(currentRoom);
            });
        };

        window.joinRoom = function() {
            const code = document.getElementById('room-input').value.trim().toUpperCase();
            if (!code) {
                alert('الرجاء إدخال رمز الغرفة');
                return;
            }
            currentRoom = code;
            localStorage.setItem('study_room_code', currentRoom);
            window.history.pushState({}, '', `?room=${currentRoom}`);
            connectToRoom(currentRoom);
        };

        function connectToRoom(roomCode) {
            document.getElementById('current-room-displayinnerText') || (document.getElementById('current-room-display').innerText = roomCode);
            document.getElementById('challenge-container').classList.remove('hidden');

            if (unsubscribeRTDB) unsubscribeRTDB();

            const roomRef = ref(db, 'rooms/' + roomCode);
            unsubscribeRTDB = onValue(roomRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    // Initialize if empty
                    set(roomRef, { goal: 20, competitors: {} });
                    return;
                }
                renderApp(data);
            });
        }

        window.updateGoal = function() {
            if (!currentRoom) return;
            const newGoal = parseFloat(document.getElementById('weekly-goal-input').value) || 20;
            update(ref(db, `rooms/${currentRoom}`), { goal: newGoal });
        };

        window.addCompetitor = function() {
            if (!currentRoom) return;
            const nameInput = document.getElementById('competitor-name');
            const name = nameInput.value.trim();
            if (!name) {
                alert('الرجاء إدخال اسمك');
                return;
            }

            const compRef = ref(db, `rooms/${currentRoom}/competitors/${name}`);
            get(compRef).then((snapshot) => {
                if (!snapshot.exists()) {
                    set(compRef, { hours: 0, joinedAt: Date.now() });
                }
                nameInput.value = '';
                // Select automatically in dropdown
                document.getElementById('active-competitor-select').value = name;
                document.getElementById('log-section').classList.remove('hidden');
            });
        };

        window.logHours = function() {
            if (!currentRoom) return;
            const name = document.getElementById('active-competitor-select').value;
            const hoursToAdd = parseFloat(document.getElementById('hours-to-add').value);

            if (!name) {
                alert('الرجاء اختيار اسمك من القائمة');
                return;
            }
            if (isNaN(hoursToAdd) || hoursToAdd <= 0) {
                alert('الرجاء إدخال عدد ساعات صحيح');
                return;
            }

            const compRef = ref(db, `rooms/${currentRoom}/competitors/${name}`);
            get(compRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const currentHours = snapshot.val().hours || 0;
                    const updatedHours = currentHours + hoursToAdd;
                    update(compRef, { hours: updatedHours });
                    document.getElementById('hours-to-add').value = '';
                }
            });
        };

        function renderApp(data) {
            const goal = data.goal || 20;
            document.getElementById('weekly-goal-input').value = goal;

            const competitorsObj = data.competitors || {};
            const competitorsArr = Object.keys(competitorsObj).map(name => ({
                name,
                hours: competitorsObj[name].hours || 0,
                joinedAt: competitorsObj[name].joinedAt || 0
            }));

            // Sort competitors by hours descending, then joinedAt ascending
            competitorsArr.sort((a, b) => b.hours - a.hours || a.joinedAt - b.joinedAt);

            // Populate dropdown
            const select = document.getElementById('active-competitor-select');
            const currentSelected = select.value;
            select.innerHTML = '<option value="">اختر اسمك...</option>';
            competitorsArr.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.name;
                opt.textContent = c.name;
                select.appendChild(opt);
            });
            select.value = currentSelected;
            if (competitorsArr.length > 0) {
                document.getElementById('log-section').classList.remove('hidden');
            }

            // Render Leaderboard
            const leaderboardList = document.getElementById('leaderboard-list');
            leaderboardList.innerHTML = '';

            if (competitorsArr.length === 0) {
                leaderboardList.innerHTML = `<p class="text-center text-slate-500 py-4">لا يوجد منافسين في هذه الغرفة بعد. انضم الآن وابدأ التحدي!</p>`;
                return;
            }

            let winnerFound = false;

            competitorsArr.forEach((c, index) => {
                const percentage = Math.min(Math.round((c.hours / goal) * 100), 100);
                const isWinner = c.hours >= goal;

                if (isWinner && index === 0 && !window.hasCelebrated) {
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                    window.hasCelebrated = true;
                }

                const item = document.createElement('div');
                item.className = `bg-slate-900/70 p-4 rounded-xl border ${isWinner ? 'border-emerald-500 bg-emerald-950/20' : 'border-slate-700'} flex flex-col gap-2`;
                
                item.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <span class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm ${index === 0 ? 'bg-amber-500 text-slate-950' : index === 1 ? 'bg-slate-300 text-slate-950' : index === 2 ? 'bg-amber-700 text-white' : 'bg-slate-800 text-slate-400'}">
                                ${index + 1}
                            </span>
                            <span class="font-bold text-white text-base sm:text-lg">${escapeHtml(c.name)}</span>
                            ${isWinner ? '<span class="bg-emerald-500 text-slate-950 text-xs font-black px-2 py-0.5 rounded-full">🏆 الفائز بالهدف!</span>' : ''}
                        </div>
                        <div class="text-cyan-400 font-bold text-sm sm:text-base">
                            ${c.hours} / ${goal} ساعة
                        </div>
                    </div>
                    <!-- Progress Bar -->
                    <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden">
                        <div class="bg-gradient-to-r from-cyan-500 to-indigo-500 h-full transition-all duration-500" style="width: ${percentage}%"></div>
                    </div>
                `;
                leaderboardList.appendChild(item);
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
